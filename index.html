    <meta name="theme-color" content="#006948" />
    <link rel="canonical" href="https://nexafinance-client.vercel.app/" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="NexaFinance — Next-Gen SME Treasury & Autonomous Financial Platform" />
